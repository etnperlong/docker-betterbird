name: Docker image CI/CD

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  DOCKER_IMAGE_NAME: etnperlong/betterbird
  GHCR_IMAGE_NAME: ghcr.io/etnperlong/betterbird

on:
  push:
    branches: '*'
    tags:
      - v[0-9][0-9].[0-9][0-9].[0-9]+
      - v[0-9][0-9].[0-9][0-9].[0-9]+-pre.[0-9]+
  pull_request:
  workflow_dispatch:

jobs:
  prepare:
    name: Prepare build
    runs-on: ubuntu-24.04
    outputs:
      betterbird_version: ${{ steps.prepare.outputs.betterbird_version }}
      dockerhub_tags: ${{ steps.prepare.outputs.dockerhub_tags }}
      ghcr_tags: ${{ steps.prepare.outputs.ghcr_tags }}
      is_release: ${{ steps.prepare.outputs.is_release }}
      label_version: ${{ steps.prepare.outputs.label_version }}
      patch_revision: ${{ steps.prepare.outputs.patch_revision }}
      release_type: ${{ steps.prepare.outputs.release_type }}
      version: ${{ steps.prepare.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          source build/betterbird.env

          VERSION=unknown
          if [[ $GITHUB_REF =~ refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [[ $GITHUB_REF =~ refs/heads/* ]]; then
            VERSION=${GITHUB_SHA::8}
          elif [[ $GITHUB_REF =~ refs/pull/* ]]; then
            VERSION=pr-${{ github.event.number }}
          else
            echo "::error::Unexpected GITHUB_REF: $GITHUB_REF"
            exit 1
          fi

          LABEL_VERSION=$VERSION
          if [[ $GITHUB_REF =~ refs/tags/* ]]; then
            LABEL_VERSION=${VERSION:1}
          fi

          DOCKERHUB_TAGS="${{ env.DOCKER_IMAGE_NAME }}:$VERSION"
          GHCR_TAGS="${{ env.GHCR_IMAGE_NAME }}:$VERSION"
          if [[ $GITHUB_REF =~ refs/tags/* ]]; then
            DOCKERHUB_TAGS="$DOCKERHUB_TAGS,${{ env.DOCKER_IMAGE_NAME }}:latest"
            GHCR_TAGS="$GHCR_TAGS,${{ env.GHCR_IMAGE_NAME }}:latest"
          fi

          if [[ $GITHUB_REF =~ refs/tags/* ]]; then
            IS_RELEASE=yes
            if [[ $GITHUB_REF =~ -pre\.[0-9]+ ]]; then
              RELEASE_TYPE=pre
            else
              RELEASE_TYPE=standard
            fi
          else
            IS_RELEASE=no
            RELEASE_TYPE=n/a
          fi

          echo "::group::Results"
          echo "GitHub reference: $GITHUB_REF"
          echo "Release: $IS_RELEASE"
          echo "Release type: $RELEASE_TYPE"
          echo "Betterbird version: $BETTERBIRD_VERSION"
          echo "Betterbird patch revision: $BETTERBIRD_PATCH_REVISION"
          echo "Docker container version: $VERSION"
          echo "Docker container label version: $LABEL_VERSION"
          echo "Docker Hub tags: $DOCKERHUB_TAGS"
          echo "GitHub Container Registry tags: $GHCR_TAGS"
          echo "::endgroup::"

          {
            echo "betterbird_version=$BETTERBIRD_VERSION"
            echo "dockerhub_tags=$DOCKERHUB_TAGS"
            echo "ghcr_tags=$GHCR_TAGS"
            echo "is_release=$IS_RELEASE"
            echo "label_version=$LABEL_VERSION"
            echo "patch_revision=$BETTERBIRD_PATCH_REVISION"
            echo "release_type=$RELEASE_TYPE"
            echo "version=$VERSION"
          } >>"$GITHUB_OUTPUT"

  build-package:
    name: Build Betterbird package (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0

      - name: Setup LLVM toolchain
        shell: bash
        run: |
          set -euo pipefail
          source build/betterbird.env
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ca-certificates curl gnupg
          curl --fail --silent --show-error https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor --yes --output /usr/share/keyrings/apt.llvm.org.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM_VERSION main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            "clang-$LLVM_VERSION" \
            "lld-$LLVM_VERSION" \
            "llvm-$LLVM_VERSION"
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >>"$GITHUB_PATH"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf2.13 \
            build-essential \
            curl \
            file \
            git \
            libasound2-dev \
            libdbus-1-dev \
            libdbus-glib-1-dev \
            libdbusmenu-gtk3-dev \
            libgtk-3-dev \
            libpulse-dev \
            libx11-xcb-dev \
            libxt-dev \
            nasm \
            ninja-build \
            patch \
            pkg-config \
            python3-dev \
            python3-pip \
            python3-setuptools \
            python3-venv \
            python3-wheel \
            unzip \
            uuid-dev \
            wget \
            xz-utils \
            yasm \
            zip

      - name: Install Rust build tools
        shell: bash
        run: |
          set -euo pipefail
          source build/betterbird.env
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          cargo "+$RUST_VERSION" install cbindgen \
            --version "$CBINDGEN_VERSION" \
            --locked

      - name: Build Betterbird package
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          OUTPUT_DIR: ${{ github.workspace }}/dist
          WORK_DIR: ${{ runner.temp }}/betterbird-build
        run: scripts/build-betterbird-package.sh

      - name: Upload Betterbird package
        uses: actions/upload-artifact@v7
        with:
          name: betterbird-${{ needs.prepare.outputs.betterbird_version }}-${{ matrix.arch }}
          path: |
            dist/*.tar.xz
            dist/*.sha256
            dist/*.provenance.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  build-image:
    name: Build image (${{ matrix.arch }})
    needs:
      - prepare
      - build-package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Betterbird package
        uses: actions/download-artifact@v8
        with:
          name: betterbird-${{ needs.prepare.outputs.betterbird_version }}-${{ matrix.arch }}
          path: dist

      - name: Prepare Docker build context
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=(dist/*.tar.xz)
          checksums=(dist/*.sha256)
          provenance_files=(dist/*.provenance.json)
          if (( ${#packages[@]} != 1 || ${#checksums[@]} != 1 || ${#provenance_files[@]} != 1 )); then
            echo "::error::Expected one package, checksum, and provenance file"
            exit 1
          fi

          (
            cd dist
            sha256sum --check --strict "$(basename "${checksums[0]}")"
          )

          mkdir -p build/betterbird
          cp "${packages[0]}" build/betterbird/betterbird.tar.xz
          cp "${provenance_files[0]}" build/betterbird/provenance.json
          (
            cd build/betterbird
            sha256sum betterbird.tar.xz >betterbird.tar.xz.sha256
          )

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: ${{ needs.prepare.outputs.is_release == 'yes' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to GitHub Container Registry
        if: ${{ needs.prepare.outputs.is_release == 'yes' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        if: ${{ needs.prepare.outputs.is_release != 'yes' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=cacheonly
          build-args: |
            BETTERBIRD_PATCH_REVISION=${{ needs.prepare.outputs.patch_revision }}
            BETTERBIRD_VERSION=${{ needs.prepare.outputs.betterbird_version }}
            DOCKER_IMAGE_VERSION=${{ needs.prepare.outputs.label_version }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      - name: Build and push image by digest
        if: ${{ needs.prepare.outputs.is_release == 'yes' }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: |
            type=image,name=${{ env.DOCKER_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
            type=image,name=${{ env.GHCR_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BETTERBIRD_PATCH_REVISION=${{ needs.prepare.outputs.patch_revision }}
            BETTERBIRD_VERSION=${{ needs.prepare.outputs.betterbird_version }}
            DOCKER_IMAGE_VERSION=${{ needs.prepare.outputs.label_version }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      - name: Export image digest
        if: ${{ needs.prepare.outputs.is_release == 'yes' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p digests
          printf '%s\n' '${{ steps.build.outputs.digest }}' >digests/${{ matrix.arch }}.txt

      - name: Upload image digest
        if: ${{ needs.prepare.outputs.is_release == 'yes' }}
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 1

  merge-manifest:
    name: Merge image manifest
    needs:
      - prepare
      - build-image
    if: ${{ needs.prepare.outputs.is_release == 'yes' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform manifests
        env:
          DOCKERHUB_TAGS: ${{ needs.prepare.outputs.dockerhub_tags }}
          GHCR_TAGS: ${{ needs.prepare.outputs.ghcr_tags }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          digest_files=(digests/*.txt)
          if (( ${#digest_files[@]} != 2 )); then
            echo "::error::Expected two image digests, found ${#digest_files[@]}"
            exit 1
          fi

          create_manifest() {
            local image=$1
            local tags_csv=$2
            local digest
            local digest_file
            local -a sources=()
            local -a tag_args=()
            local -a tags=()

            IFS=',' read -r -a tags <<<"$tags_csv"
            for digest_file in "${digest_files[@]}"; do
              digest=$(<"$digest_file")
              sources+=("$image@$digest")
            done
            for tag in "${tags[@]}"; do
              tag_args+=(--tag "$tag")
            done

            docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          }

          create_manifest '${{ env.DOCKER_IMAGE_NAME }}' "$DOCKERHUB_TAGS"
          create_manifest '${{ env.GHCR_IMAGE_NAME }}' "$GHCR_TAGS"

      - name: Inspect Docker Hub image
        run: docker buildx imagetools inspect ${{ env.DOCKER_IMAGE_NAME }}:${{ needs.prepare.outputs.version }}

      - name: Inspect GitHub Container Registry image
        run: docker buildx imagetools inspect ${{ env.GHCR_IMAGE_NAME }}:${{ needs.prepare.outputs.version }}

      - name: Checkout
        if: ${{ needs.prepare.outputs.release_type == 'standard' }}
        uses: actions/checkout@v6

      - name: Update Docker Hub description
        if: ${{ needs.prepare.outputs.release_type == 'standard' }}
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ env.DOCKER_IMAGE_NAME }}
          readme-filepath: DOCKERHUB.md

  notification:
    name: Notification
    needs:
      - prepare
      - build-package
      - build-image
      - merge-manifest
    runs-on: ubuntu-24.04
    if: ${{ always() && github.event_name != 'pull_request' }}

    steps:
      - name: Pushover notification
        uses: desiderati/github-action-pushover@v1
        with:
          job-status: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          pushover-api-token: ${{ secrets.PUSHOVER_API_TOKEN }}
          pushover-user-key: ${{ secrets.PUSHOVER_USER_KEY }}
